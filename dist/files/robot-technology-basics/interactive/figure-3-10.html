<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>图3.10 · 点绕任意轴旋转</title>
  <style>
    *{box-sizing:border-box}html,body{width:100%;height:100%;margin:0;overflow:hidden}
    body{color:#18243b;background:radial-gradient(circle at 82% 10%,#dceaff 0,transparent 34%),linear-gradient(145deg,#f9fbff,#edf3fa);font-family:-apple-system,BlinkMacSystemFont,"Segoe UI","Microsoft YaHei",sans-serif}
    .app{position:relative;width:100%;height:100%;min-height:500px;user-select:none;-webkit-user-select:none}
    svg{width:100%;height:100%;cursor:grab;touch-action:none;-webkit-user-drag:none;overscroll-behavior:contain}svg.dragging{cursor:grabbing}
    .grid{stroke:#dbe5f2;stroke-width:1}.axis{stroke:#34445a;stroke-width:3}.k-axis{stroke:#e23a34;stroke-width:4}.oa{stroke:#1a73e8;stroke-width:5}.oap{stroke:#2e9e63;stroke-width:5}.arc{fill:none;stroke:#2e9e63;stroke-width:3;stroke-dasharray:8 7}.point{stroke:#fff;stroke-width:4}
    text{paint-order:stroke;stroke:#f5f9ff;stroke-width:6px;stroke-linejoin:round;font:700 19px "Cambria Math","Times New Roman",serif}.axis-text{fill:#34445a}.k-text{fill:#c72d28}.a-text{fill:#174ea6}.ap-text{fill:#168252}.theta{fill:#2e9e63;font-size:22px}
    .panel{position:absolute;top:18px;left:18px;width:min(270px,calc(100% - 36px));padding:16px 18px;border:1px solid #d4deec;border-radius:14px;background:rgba(255,255,255,.9);box-shadow:0 16px 38px rgba(30,64,175,.12);backdrop-filter:blur(10px)}
    h1{margin:0 0 5px;font-size:16px}.sub{margin:0 0 15px;color:#758197;font-size:11.5px;line-height:1.5}.row{display:flex;justify-content:space-between;font-size:13px}.row b{color:#1a73e8}input[type=range]{width:100%;margin:10px 0 5px;accent-color:#1a73e8}.check{display:flex;align-items:center;gap:7px;margin-top:10px;color:#5b6675;font-size:12px}.check input{accent-color:#1a73e8}.legend{display:flex;gap:13px;margin-top:12px;color:#5b6675;font-size:11px}.legend i{display:inline-block;width:13px;height:3px;margin-right:4px;vertical-align:middle}
    .hint{position:absolute;top:18px;right:18px;padding:8px 11px;border-radius:999px;color:#69768b;background:rgba(255,255,255,.82);font-size:11px}
    @media(max-width:680px){.panel{top:10px;left:10px;width:calc(100% - 20px);padding:13px 15px}.hint{display:none}.app{min-height:560px}}
  </style>
</head>
<body>
<main class="app">
  <svg id="view" viewBox="0 0 1000 620" aria-label="点A绕过原点的任意单位轴k旋转θ角的交互示意图">
    <defs>
      <marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0 10 5 0 10z" fill="#34445a"/></marker>
      <marker id="arrowK" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0 10 5 0 10z" fill="#e23a34"/></marker>
      <marker id="arrowA" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0 10 5 0 10z" fill="#1a73e8"/></marker>
      <marker id="arrowAp" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0 10 5 0 10z" fill="#2e9e63"/></marker>
    </defs>
    <g id="grid"></g><g id="scene"></g>
  </svg>
  <section class="panel">
    <h1>点绕任意轴旋转</h1>
    <p class="sub">拖动旋转视角，滚轮缩放；调节 θ 观察 A 绕单位轴 k 到达 A′。</p>
    <div class="row"><span>旋转角 θ</span><b id="value">60°</b></div>
    <input id="theta" type="range" min="0" max="180" value="60" step="1">
    <label class="check"><input id="spin" type="checkbox">自动旋转视角</label>
    <div class="legend"><span><i style="background:#1a73e8"></i>OA</span><span><i style="background:#e23a34"></i>轴 k</span><span><i style="background:#2e9e63"></i>A′ 与轨迹</span></div>
  </section>
  <div class="hint">拖动旋转 · 滚轮缩放</div>
</main>
<script>
(()=>{
  const NS='http://www.w3.org/2000/svg',view=document.querySelector('#view'),grid=document.querySelector('#grid'),scene=document.querySelector('#scene'),slider=document.querySelector('#theta'),value=document.querySelector('#value'),spin=document.querySelector('#spin');
  const state={yaw:-.72,pitch:.48,scale:78,drag:false,pid:null,x:0,y:0,auto:false};
  const O={x:570,y:370},K=norm([.48,.58,.66]),A=[2.45,-.55,1.35];let raf=0;
  function norm(v){const n=Math.hypot(...v);return v.map(x=>x/n)}function mul(v,s){return v.map(x=>x*s)}function dot(a,b){return a[0]*b[0]+a[1]*b[1]+a[2]*b[2]}function cross(a,b){return[a[1]*b[2]-a[2]*b[1],a[2]*b[0]-a[0]*b[2],a[0]*b[1]-a[1]*b[0]]}
  function rot(v,k,t){const c=Math.cos(t),s=Math.sin(t),kv=cross(k,v),d=dot(k,v);return[v[0]*c+kv[0]*s+k[0]*d*(1-c),v[1]*c+kv[1]*s+k[1]*d*(1-c),v[2]*c+kv[2]*s+k[2]*d*(1-c)]}
  function p(v){const cy=Math.cos(state.yaw),sy=Math.sin(state.yaw),cp=Math.cos(state.pitch),sp=Math.sin(state.pitch),x=v[0]*cy-v[1]*sy,y=v[0]*sy+v[1]*cy,z=v[2];return{x:O.x+x*state.scale,y:O.y-(y*sp+z*cp)*state.scale}}
  function el(tag,attrs,parent=scene){const e=document.createElementNS(NS,tag);Object.entries(attrs||{}).forEach(([k,v])=>e.setAttribute(k,v));parent.appendChild(e);return e}function line(a,b,cls,marker){const A=p(a),B=p(b);return el('line',{x1:A.x,y1:A.y,x2:B.x,y2:B.y,class:cls,...(marker?{'marker-end':`url(#${marker})`}:{})})}function text(v,s,cls,dx=8,dy=-8){const P=p(v),e=el('text',{x:P.x+dx,y:P.y+dy,class:cls});e.textContent=s;return e}
  function drawGrid(){grid.replaceChildren();for(let i=-3;i<=3;i++){[[[-3,i,0],[3,i,0]],[[i,-3,0],[i,3,0]]].forEach(q=>{const a=p(q[0]),b=p(q[1]);el('line',{x1:a.x,y1:a.y,x2:b.x,y2:b.y,class:'grid'},grid)})}}
  function render(){scene.replaceChildren();drawGrid();const axes=[[[3.4,0,0],'X'],[[0,3.4,0],'Y'],[[0,0,3.4],'Z']];axes.forEach(([v,n])=>{line([0,0,0],v,'axis','arrow');text(v,n,'axis-text')});text([0,0,0],'O','axis-text',-24,24);
    line(mul(K,-1.1),mul(K,4.0),'k-axis','arrowK');text(mul(K,4.0),'k','k-text',10,-8);line([0,0,0],A,'oa','arrowA');text(A,'A','a-text',12,-12);
    const t=Number(slider.value)*Math.PI/180,B=rot(A,K,t),pts=[];for(let i=0;i<=64;i++){const q=p(rot(A,K,t*i/64));pts.push(`${q.x},${q.y}`)}el('polyline',{points:pts.join(' '),class:'arc'});line([0,0,0],B,'oap','arrowAp');const bp=p(B);el('circle',{cx:bp.x,cy:bp.y,r:8,fill:'#2e9e63',class:'point'});text(B,"A′",'ap-text',12,-12);if(t>.08)text(rot(A,K,t/2),'θ','theta',13,-13);value.textContent=slider.value+'°'}
  slider.addEventListener('input',render);spin.addEventListener('change',e=>{state.auto=e.target.checked;if(state.auto&&!raf)raf=requestAnimationFrame(tick)});view.addEventListener('pointerdown',e=>{if(e.button!==0)return;e.preventDefault();state.drag=true;state.pid=e.pointerId;state.x=e.clientX;state.y=e.clientY;view.setPointerCapture(e.pointerId);view.classList.add('dragging')});view.addEventListener('pointermove',e=>{if(!state.drag||e.pointerId!==state.pid)return;e.preventDefault();state.yaw-=(e.clientX-state.x)*.008;state.pitch=Math.max(-1.05,Math.min(1.05,state.pitch-(e.clientY-state.y)*.007));state.x=e.clientX;state.y=e.clientY;render()});function end(e){if(e&&state.pid!==null&&e.pointerId!==state.pid)return;state.drag=false;state.pid=null;view.classList.remove('dragging')}view.addEventListener('pointerup',end);view.addEventListener('pointercancel',end);view.addEventListener('lostpointercapture',end);view.addEventListener('dragstart',e=>e.preventDefault());view.addEventListener('wheel',e=>{e.preventDefault();state.scale=Math.max(48,Math.min(118,state.scale*(e.deltaY>0?.92:1.08)));render()},{passive:false});function tick(){raf=0;if(!state.auto)return;state.yaw-=.003;render();raf=requestAnimationFrame(tick)}render();
})();
</script>
</body>
</html>
