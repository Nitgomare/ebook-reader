<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="theme-color" content="#f7f6f1" />
    <title>科研知识库 · 电子书</title>
    <link rel="stylesheet" href="styles.css" />
    <script>
      window.MathJax = {
        tex: {
          inlineMath: [["\\(", "\\)"]],
          displayMath: [["\\[", "\\]"]],
          processEscapes: true,
          processEnvironments: true
        },
        options: {
          ignoreHtmlClass: ".*|",
          processHtmlClass: "arithmatex"
        }
      };
    </script>
    <script defer src="https://cdn.jsdelivr.net/npm/mathjax@3/es5/tex-mml-chtml.js"></script>
    <script defer src="app.js"></script>
  </head>
  <body class="is-loading">
    <header class="topbar">
      <button class="icon-button menu-button" id="openNav" type="button" aria-label="打开章节目录">
        <span></span><span></span><span></span>
      </button>
      <a class="brand" href="#/" aria-label="返回电子书首页">
        <span class="brand-mark">研</span>
        <span><strong id="siteTitle">科研知识库</strong><small>电子书</small></span>
      </a>
      <nav class="top-links" aria-label="主要入口">
        <a href="#/">书架</a>
        <a href="#/" id="startReadingLink">开始阅读</a>
      </nav>
      <div class="top-meta" id="topMeta">正在整理书架</div>
    </header>

    <div class="app-shell">
      <aside class="sidebar" id="sidebar" aria-label="电子书章节">
        <div class="sidebar-head">
          <div><p class="eyebrow">CONTENTS</p><h2 id="sidebarTitle">电子书目录</h2></div>
          <button class="icon-button close-button" id="closeNav" type="button" aria-label="关闭目录">×</button>
        </div>
        <label class="search-box">
          <span class="search-label">搜索章节</span>
          <input id="searchInput" type="search" placeholder="标题、章节或关键词" autocomplete="off" />
        </label>
        <div class="catalog-status" id="catalogStatus">正在生成目录</div>
        <nav class="nav-tree" id="navTree"></nav>
      </aside>

      <main class="reader" id="reader">
        <section class="library-home" id="libraryHome" hidden>
          <header class="hero">
            <p class="eyebrow">DIGITAL READING ROOM</p>
            <h1 id="heroTitle">把知识放进一条连续的阅读路径。</h1>
            <p id="heroSubtitle">从书架进入章节，在同一个界面里搜索、阅读和跳转。</p>
            <a class="primary-action" id="heroAction" href="#/">浏览电子书 <span>→</span></a>
          </header>
          <section class="shelf-section" aria-labelledby="shelfTitle">
            <div class="section-heading"><div><p class="eyebrow">LIBRARY</p><h2 id="shelfTitle">电子书架</h2></div><p id="shelfStats"></p></div>
            <div class="book-grid" id="bookGrid"></div>
          </section>
        </section>

        <section class="document-view" id="documentView" hidden>
          <header class="reader-head">
            <div><p class="breadcrumb" id="breadcrumb">电子书</p><h1 id="docTitle">正在加载</h1></div>
            <button class="outline-toggle" id="outlineToggle" type="button">本文目录</button>
          </header>
          <article class="article" id="article" aria-live="polite"></article>
          <nav class="pager" aria-label="上一篇和下一篇">
            <a id="previousLink" href="#"></a>
            <a id="nextLink" href="#"></a>
          </nav>
        </section>
      </main>

      <aside class="outline" id="outline" aria-label="本文目录">
        <div class="outline-inner"><p class="eyebrow">ON THIS PAGE</p><nav id="outlineNav"></nav></div>
      </aside>
    </div>
    <div class="scrim" id="scrim"></div>
    <noscript>这个电子书阅读器需要启用 JavaScript。</noscript>
  </body>
</html>
