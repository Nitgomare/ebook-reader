<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="theme-color" content="#f7f6f1" />
    <title>公共知识学习中心</title>
    <link rel="stylesheet" href="styles.css?v=__ASSET_VERSION__" />
    <script>
      window.MathJax = {
        tex: {
          inlineMath: [["\\(", "\\)"]],
          displayMath: [["\\[", "\\]"]],
          processEscapes: true,
          processEnvironments: true
        },
        options: {
          ignoreHtmlClass: ".*|",
          processHtmlClass: "arithmatex"
        }
      };
    </script>
    <script defer src="app.js?v=__ASSET_VERSION__"></script>
    <script async src="https://cdn.jsdelivr.net/npm/mathjax@3/es5/tex-mml-chtml.js"></script>
  </head>
  <body class="is-loading">
    <header class="topbar">
      <button class="icon-button menu-button" id="openNav" type="button" aria-label="打开章节目录">
        <span></span><span></span><span></span>
      </button>
      <a class="brand" href="#/" aria-label="返回学习中心首页">
        <span class="brand-mark">知</span>
        <span><strong id="siteTitle">公共知识学习中心</strong><small>KNOWLEDGE HUB</small></span>
      </a>
      <nav class="top-links" aria-label="主要入口">
        <a href="#/">知识分类</a>
        <a href="#/code">代码与数据</a>
        <a href="#/" id="startReadingLink">继续学习</a>
      </nav>
      <div class="top-meta" id="topMeta">正在整理课程</div>
    </header>

    <div class="app-shell">
      <aside class="sidebar" id="sidebar" aria-label="课程章节">
        <div class="sidebar-head">
          <div><p class="eyebrow">CONTENTS</p><h2 id="sidebarTitle">课程目录</h2></div>
          <button class="icon-button close-button" id="closeNav" type="button" aria-label="关闭目录">×</button>
        </div>
        <label class="search-box">
          <span class="search-label" id="searchLabel">搜索章节</span>
          <input id="searchInput" type="search" placeholder="标题、章节或关键词" autocomplete="off" />
        </label>
        <div class="catalog-status" id="catalogStatus">正在生成课程目录</div>
        <nav class="nav-tree" id="navTree"></nav>
      </aside>

      <main class="reader" id="reader">
        <section class="library-home" id="libraryHome" hidden>
          <header class="home-intro">
            <p class="eyebrow">PUBLIC KNOWLEDGE HUB</p>
            <h1 id="heroTitle">公共知识学习中心</h1>
            <p id="heroSubtitle">编程、数据分析与风电工程资料，按知识领域持续整理。</p>
            <div class="home-stats" id="homeStats"></div>
          </header>
          <div class="category-sections" id="categorySections"></div>
        </section>

        <section class="document-view" id="documentView" hidden>
          <header class="reader-head">
            <div><p class="breadcrumb" id="breadcrumb">课程</p><h1 id="docTitle">正在加载</h1></div>
            <button class="outline-toggle" id="outlineToggle" type="button">本文目录</button>
          </header>
          <article class="article" id="article" aria-live="polite"></article>
          <section class="related-code" id="relatedCode" hidden>
            <div class="section-heading"><div><p class="eyebrow">LEARN BY DOING</p><h2>本章配套代码与数据</h2></div></div>
            <div class="related-code-list" id="relatedCodeList"></div>
          </section>
          <nav class="pager" aria-label="上一篇和下一篇">
            <a id="previousLink" href="#"></a>
            <a id="nextLink" href="#"></a>
          </nav>
        </section>

        <section class="code-library" id="codeLibrary" hidden>
          <header class="page-intro"><p class="eyebrow">CODE & DATA</p><h1>代码、Notebook 与练习数据</h1><p>按课程在线查看源码和 Notebook；较大的数据集显示摘要，并保留原文件下载。</p></header>
          <div class="code-course-list" id="codeCourseList"></div>
        </section>

        <section class="code-view" id="codeView" hidden>
          <header class="reader-head">
            <div><p class="breadcrumb" id="codeBreadcrumb">配套代码</p><h1 id="codeTitle">正在加载</h1></div>
            <a class="download-button" id="codeDownload" href="#" download>下载原文件</a>
          </header>
          <div class="code-meta" id="codeMeta"></div>
          <div class="code-content" id="codeContent"></div>
        </section>
      </main>

      <aside class="outline" id="outline" aria-label="本文目录">
        <div class="outline-inner"><p class="eyebrow">ON THIS PAGE</p><nav id="outlineNav"></nav></div>
      </aside>
    </div>
    <div class="scrim" id="scrim"></div>
    <noscript>这个学习网站需要启用 JavaScript。</noscript>
  </body>
</html>
