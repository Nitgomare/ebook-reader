<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>更新日志 · 科研知识学习中心</title>
  <style>
    :root { font-family: "Segoe UI", "Microsoft YaHei", sans-serif; color: #233047; background: #f7f9fc; line-height: 1.8; }
    * { box-sizing: border-box; } body { margin: 0; } a { color: #2863ed; text-underline-offset: 3px; overflow-wrap: anywhere; }
    a:focus-visible { outline: 2px solid #2863ed; outline-offset: 4px; }
    .header { padding: 18px max(20px, calc((100vw - 1180px) / 2)); background: #fff; border-bottom: 1px solid #e1e7ef; }
    .header a { font-weight: 600; text-decoration: none; }
    .layout { display: grid; grid-template-columns: 260px minmax(0, 1fr); gap: 36px; max-width: 1220px; padding: 32px 20px; margin: auto; align-items: start; }
    .history-nav { position: sticky; top: 20px; max-height: calc(100vh - 40px); overflow: auto; font-size: 14px; }
    .history-nav strong { display: block; margin-bottom: 12px; } .toc ul { padding: 0; margin: 0; list-style: none; } .toc a { display: block; padding: 7px 0; text-decoration: none; }
    article { min-width: 0; background: #fff; border: 1px solid #e1e7ef; border-radius: 12px; padding: 30px 36px; overflow-wrap: anywhere; }
    h1 { margin-top: 0; font-size: 30px; } h2 { border-top: 1px solid #e1e7ef; padding-top: 28px; margin-top: 36px; font-size: 21px; scroll-margin-top: 20px; } h3 { font-size: 16px; color: #56657c; }
    li { margin-bottom: 8px; } article ul { padding-left: 24px; } code { background: #f0f3f8; border-radius: 4px; padding: 2px 4px; font-size: .88em; white-space: normal; }
    footer { text-align: center; padding: 20px; color: #748198; font-size: 14px; }
    @media (max-width: 760px) { .layout { grid-template-columns: minmax(0, 1fr); gap: 20px; padding: 20px 14px; } .history-nav { position: static; max-height: 200px; border-bottom: 1px solid #e1e7ef; padding-bottom: 16px; } article { padding: 22px 18px; } h1 { font-size: 26px; } h2 { font-size: 19px; } }
  </style>
</head>
<body>
  <header class="header"><a href="index.html#/">← 返回科研知识学习中心</a></header>
  <main class="layout">
    <nav class="history-nav" aria-label="按日期查看更新"><strong>更新记录 · 最新在前</strong><!-- CHANGELOG_TOC --></nav>
    <article><!-- CHANGELOG_BODY --></article>
  </main>
  <footer><a href="index.html#/">返回学习中心</a> · <a href="#">回到顶部</a></footer>
</body>
</html>
