site_name: "风力发电机组理论与设计"

docs_dir: docs
site_dir: "../../site/book-sites/wind-turbine-theory-and-design"

theme:
  name: material
  language: zh

  icon:
    logo: material/wind-turbine

  features:
    - toc.follow
    - navigation.top
    - navigation.footer
    - navigation.path
    - content.code.copy

nav:
  - 课程首页: index.md
  - 前置内容: 00-front-matter/index.md
  - "第1章 绪论": chapters/01-chapter/index.md
  - "第2章 能量转换和传输理论": chapters/02-chapter/index.md
  - "第3章 风力发电机组设计要求": chapters/03-chapter/index.md
  - "第4章 载荷": chapters/04-chapter/index.md
  - "第5章 总体设计": chapters/05-chapter/index.md
  - "第6章 风轮": chapters/06-chapter/index.md
  - "第7章 风力发电机": chapters/07-chapter/index.md
  - "第8章 主传动链": chapters/08-chapter/index.md
  - "第9章 塔架与基础": chapters/09-chapter/index.md
  - "第10章 控制系统": chapters/10-chapter/index.md
  - "第11章 状态监测及故障诊断": chapters/11-chapter/index.md
  - "第12章 强度分析": chapters/12-chapter/index.md
  - 参考文献与附加信息: 99-back-matter/index.md

markdown_extensions:
  - tables
  - attr_list
  - md_in_html
  - pymdownx.arithmatex:
      generic: true
  - toc:
      permalink: true
      toc_depth: "2-3"

extra_javascript:
  - assets/javascripts/mathjax.js
  - assets/javascripts/back-to-main.js
  - https://unpkg.com/mathjax@3/es5/tex-mml-chtml.js

extra_css:
  - assets/stylesheets/course-home.css
  - assets/stylesheets/back-to-main.css

extra:
  homepage: "/"
